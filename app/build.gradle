plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

android {
  // Package name is permanent once published on Google Play.
  namespace 'com.omnitools.app'
  compileSdk 35

  defaultConfig {
    applicationId "com.omnitools.app"
    // 26 because the app uses java.util.Base64 and adaptive icons.
    minSdk 26
    targetSdk 35
    // Rises with every CI build so each new APK installs over the previous one.
    versionCode 100 + (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
    versionName "1.0.1"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  signingConfigs {
    release {
      storeFile file(System.getenv("RELEASE_STORE_FILE") ?: "release.keystore")
      storePassword System.getenv("RELEASE_STORE_PASSWORD")
      keyAlias System.getenv("RELEASE_KEY_ALIAS")
      keyPassword System.getenv("RELEASE_KEY_PASSWORD")
    }
  }
  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.release
    }
    debug {
      applicationIdSuffix ".debug"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  buildFeatures {
    compose true
    buildConfig true
  }

  packaging {
    resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
  }

  testOptions {
    unitTests.all {
      // Print why a test failed directly in the CI log.
      testLogging {
        events 'failed'
        exceptionFormat 'full'
      }
    }
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
  implementation 'androidx.activity:activity-compose:1.9.3'

  implementation platform('androidx.compose:compose-bom:2024.12.01')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.material:material-icons-extended'
  implementation 'androidx.navigation:navigation-compose:2.8.5'
  implementation 'androidx.datastore:datastore-preferences:1.1.1'
  implementation 'androidx.media3:media3-exoplayer:1.5.1'
  implementation 'androidx.media3:media3-ui:1.5.1'

  // QR / barcode scanning (on-device) and offline QR generation
  implementation 'androidx.camera:camera-core:1.4.1'
  implementation 'androidx.camera:camera-camera2:1.4.1'
  implementation 'androidx.camera:camera-lifecycle:1.4.1'
  implementation 'androidx.camera:camera-view:1.4.1'
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
  implementation 'com.google.zxing:core:3.5.3'

  debugImplementation 'androidx.compose.ui:ui-tooling'

  testImplementation 'junit:junit:4.13.2'
  // android.jar's org.json is a stub that throws in JVM unit tests; use the real implementation there.
  testImplementation 'org.json:json:20240303'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
