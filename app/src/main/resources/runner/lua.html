<!DOCTYPE html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://omnitools.local; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:sans-serif;margin:0;padding:16px;background:#0e1220;color:#e8ebf7}pre{white-space:pre-wrap;word-break:break-word;font-family:monospace;font-size:14px;margin:0}.err{color:#ff8a8a}</style>
</head><body><pre id="out"></pre>
<script src="https://omnitools.local/rt/fengari-web.js"></script>
<script>
(function () {
  var CODE = /*CODE*/;
  var out = document.getElementById('out');
  function add(text, cls) { var s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; out.appendChild(s); }
  if (typeof fengari === 'undefined') { add('Lua is not included in this build of the app.\n', 'err'); return; }
  var lua = fengari.lua, lauxlib = fengari.lauxlib, lualib = fengari.lualib, to_luastring = fengari.to_luastring, to_jsstring = fengari.to_jsstring;
  var L = lauxlib.luaL_newstate();
  lualib.luaL_openlibs(L);
  // print() writes to the page instead of the browser console.
  lua.lua_pushcfunction(L, function (L) {
    var n = lua.lua_gettop(L), parts = [];
    for (var i = 1; i <= n; i++) parts.push(to_jsstring(lauxlib.luaL_tolstring(L, i))), lua.lua_pop(L, 1);
    add(parts.join('\t') + '\n');
    return 0;
  });
  lua.lua_setglobal(L, to_luastring('print'));
  var status = lauxlib.luaL_loadstring(L, to_luastring(CODE));
  if (status === lua.LUA_OK) status = lua.lua_pcall(L, 0, 0, 0);
  if (status !== lua.LUA_OK) add(to_jsstring(lua.lua_tostring(L, -1)) + '\n', 'err');
})();
</script></body></html>
