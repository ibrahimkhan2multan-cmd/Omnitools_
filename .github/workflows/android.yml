
name: Android Native CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  create:
    tags:
      - 'v*' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.7.x needs Gradle 8.9 or newer.
          gradle-version: '8.9'

      - name: 🧰 Fetch offline language runtimes (Python, SQL, Lua, TypeScript)
        run: bash scripts/fetch-runtimes.sh

      - name: 🏗️ Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 📦 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # Runs after the APK is uploaded so a failing test never hides the build; the job still turns red.
      - name: 🔒 Verify no network permission (debug APK)
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          $AAPT2 dump permissions "$APK" | tee perms.txt
          if grep -Eq "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" perms.txt; then echo "::error::The app must not request network permissions"; exit 1; fi

      - name: 🧪 Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: 📄 Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: 🔐 Config APK Signature
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          KEYSTORE_PATH=$RUNNER_TEMP/release.jks
          echo "$KEYSTORE_BASE64" | base64 -d > $KEYSTORE_PATH
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: 🎯 Build Release APK
        if: github.event_name != 'pull_request'
        run: gradle assembleRelease --stacktrace

      - name: ✅ Verify APK Signature
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: 🔒 Verify no network permission (release APK)
        if: github.event_name != 'pull_request'
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT2 dump permissions app/build/outputs/apk/release/app-release.apk | tee perms-release.txt
          if grep -Eq "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" perms-release.txt; then echo "::error::The app must not request network permissions"; exit 1; fi

      - name: 📦 Upload Release APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # A normal push to main publishes a ready-to-download release automatically.
      - name: 🚀 Publish Release (every push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: OmniTools build ${{ github.run_number }}
          body: Signed release APK (app-release.apk). Install it over the previous one to update.
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Attach APK to Release (v* tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
